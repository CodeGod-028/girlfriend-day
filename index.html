<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Do You Love Me? 💌</title>

<!-- Fonts: Poppins for main UI, Noto Sans Bengali for the Bengali reveal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= PAGE 1 ================= -->
  <section id="page1" class="page page-love">

    <div class="box box-question">
      <h1>Do YOU Love me</h1>
    </div>

    <div class="chase-zone" aria-hidden="true">

      <div class="runner runner-boy">
        <svg viewBox="0 0 40 52" width="100%" height="100%">
          <ellipse class="leg leg-back" cx="17" cy="40" rx="2.6" ry="10" fill="#3a3550" transform-origin="17 32"/>
          <ellipse class="leg leg-front" cx="23" cy="40" rx="2.6" ry="10" fill="#3a3550" transform-origin="23 32"/>
          <ellipse cx="20" cy="26" rx="9.5" ry="11" fill="#5b8cff"/>
          <ellipse class="arm arm-back" cx="10" cy="24" rx="2.4" ry="8" fill="#ffcfa3" transform-origin="10 18"/>
          <ellipse class="arm arm-front" cx="30" cy="24" rx="2.4" ry="8" fill="#ffcfa3" transform-origin="30 18"/>
          <circle cx="20" cy="11" r="7.5" fill="#ffcfa3"/>
          <path d="M12.5 8 Q20 2 27.5 8 L27.5 10.5 Q20 6.5 12.5 10.5 Z" fill="#5b3a25"/>
        </svg>
      </div>

      <div class="runner runner-girl">
        <svg viewBox="0 0 40 52" width="100%" height="100%">
          <ellipse class="leg leg-back" cx="17" cy="41" rx="2.4" ry="8" fill="#3a3550" transform-origin="17 35"/>
          <ellipse class="leg leg-front" cx="23" cy="41" rx="2.4" ry="8" fill="#3a3550" transform-origin="23 35"/>
          <path d="M20 22 L32 44 Q20 50 8 44 Z" fill="#ff6fa3"/>
          <ellipse class="arm arm-back" cx="9" cy="25" rx="2.2" ry="7.5" fill="#ffd9b8" transform-origin="9 19"/>
          <ellipse class="arm arm-front" cx="31" cy="25" rx="2.2" ry="7.5" fill="#ffd9b8" transform-origin="31 19"/>
          <ellipse cx="20" cy="22" rx="9" ry="10.5" fill="#ff6fa3"/>
          <circle cx="20" cy="10" r="7" fill="#ffd9b8"/>
          <path d="M12 6 Q20 -1 28 6 Q28 12 25 13 Q26 7 20 6 Q14 7 15 13 Q12 12 12 6 Z" fill="#7a3b2e"/>
          <circle cx="11.5" cy="12" r="2.6" fill="#7a3b2e"/>
          <circle cx="28.5" cy="12" r="2.6" fill="#7a3b2e"/>
        </svg>
      </div>

    </div>

    <div class="box box-buttons">
      <div class="btn-row">
        <button id="yesBtn" class="btn btn-yes" type="button">Yes</button>
        <button id="noBtn" class="btn btn-no" type="button">No</button>
      </div>
      <p class="hint">tap yes 🙈</p>
    </div>

  </section>

  <!-- ================= PAGE 2 ================= -->
  <section id="page2" class="page page-space hidden" aria-hidden="true">

    <canvas id="skyCanvas"></canvas>
    <div id="flowerLayer" aria-hidden="true"></div>

    <div class="center-text">
      <p id="knewIt" class="knew-it">I knew it</p>
      <p id="bengaliText" class="bengali-text hidden">আমি তোমাকে ভালোবাসি</p>
    </div>

    <p class="shake-hint" id="shakeHint">shake your phone ✨</p>

  </section>

  <script src="script.js"></script>
</body>
</html>
